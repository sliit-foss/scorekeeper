on:
  workflow_call:
    inputs:
      application_environment:
        type: string
        required: false
        default: 'PRODUCTION'

permissions: {}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      # Question packages pin pnpm 8, which cannot reach the registry on Node 20 and later
      npm_config_manage_package_manager_versions: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.9

      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false

      # - name: Email Workflow URL
      #   run: node src/index.js --script email-workflow-url --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --email "${{ github.event.client_payload.email }}"
      #   env:
      #     NODEMAILER_SERVICE: ${{ secrets.NODEMAILER_SERVICE }}
      #     NODEMAILER_MAIL_HOST: ${{ secrets.NODEMAILER_MAIL_HOST }}
      #     NODEMAILER_MAIL_USER: ${{ secrets.NODEMAILER_MAIL_USER }}
      #     NODEMAILER_MAIL_PASSWORD: ${{ secrets.NODEMAILER_MAIL_PASSWORD }}
      #     NODEMAILER_MAIL_DISPLAY_USER: ${{ secrets.NODEMAILER_MAIL_DISPLAY_USER }}

      - name: Download and extract submission files
        run: |
          url=$(jq -r '.client_payload.submission_url' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$url"
          curl -L "$url?$SAS_TOKEN" -o submission.zip
          unzip submission.zip -d submission
        env:
          SAS_TOKEN: ${{ inputs.application_environment == 'PRODUCTION' && secrets.PRODUCTION_SUBMISSION_CONTAINER_SAS_TOKEN || secrets.STAGING_SUBMISSION_CONTAINER_SAS_TOKEN }}

      - name: Download and extract question files
        run: |
          curl -L "$(jq -r '.client_payload.question_url' "$GITHUB_EVENT_PATH")?$SAS_TOKEN" -o question.zip
          unzip question.zip -d graded
        env:
          SAS_TOKEN: ${{ inputs.application_environment == 'PRODUCTION' && secrets.PRODUCTION_QUESTION_CONTAINER_SAS_TOKEN || secrets.STAGING_QUESTION_CONTAINER_SAS_TOKEN }}

      # Nothing from the team runs before the tests start, and only its script and inputs enter the folder the tests run in.
      - name: Add the script and inputs from the submission
        run: |
          if [ ! -f submission/execute.sh ] || [ -L submission/execute.sh ]; then
            echo "execute.sh must be a regular file at the top level of the zip"
            exit 1
          fi
          cp submission/execute.sh graded/execute.sh
          sed -i 's/\r$//' graded/execute.sh
          if [ "$STRICT_INPUTS" != "true" ] && [ -d submission/src ] && [ ! -L submission/src ]; then
            rm -rf graded/src
            cp -r submission/src graded/
            find graded/src -type l -delete
          fi
        env:
          STRICT_INPUTS: ${{ github.event.client_payload.strict_inputs }}

      - name: Install question dependencies
        run: cd graded && pnpm install --ignore-scripts --fix-lockfile

      # Tests and mocks are read from the question's test folder only
      - name: Run tests
        run: cd graded && pnpm dlx jest@29.6.2 --roots "$PWD/test"

  report:
    name: Update Score
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    environment:
      name: grading
      deployment: false
    steps:
      - name: Update score
        run: |
          curl -fsS --retry 3 -X PATCH "$BASHAWAY_SERVER_URL/api/submissions/$SUBMISSION_ID" \
            -H "x-api-key: $BASHAWAY_SERVER_API_KEY" \
            -H 'content-type: application/json' \
            -d '{"automatically_graded":true}'
        env:
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
          BASHAWAY_SERVER_URL: ${{ inputs.application_environment == 'PRODUCTION' && secrets.BASHAWAY_PRODUCTION_SERVER_URL || secrets.BASHAWAY_STAGING_SERVER_URL }}
          BASHAWAY_SERVER_API_KEY: ${{ inputs.application_environment == 'PRODUCTION' && secrets.BASHAWAY_PRODUCTION_SERVER_API_KEY || secrets.BASHAWAY_STAGING_SERVER_API_KEY }}
