on:
  workflow_call:
    inputs:
      application_environment:
        type: string
        required: false
        default: 'PRODUCTION'

permissions: {}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8.0.0

      - name: Install Node.js 18
        uses: actions/setup-node@v7
        with:
          node-version: 18.x
          package-manager-cache: false

      # - name: Email Workflow URL
      #   run: node src/index.js --script email-workflow-url --workflow-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --email "${{ github.event.client_payload.email }}"
      #   env:
      #     NODEMAILER_SERVICE: ${{ secrets.NODEMAILER_SERVICE }}
      #     NODEMAILER_MAIL_HOST: ${{ secrets.NODEMAILER_MAIL_HOST }}
      #     NODEMAILER_MAIL_USER: ${{ secrets.NODEMAILER_MAIL_USER }}
      #     NODEMAILER_MAIL_PASSWORD: ${{ secrets.NODEMAILER_MAIL_PASSWORD }}
      #     NODEMAILER_MAIL_DISPLAY_USER: ${{ secrets.NODEMAILER_MAIL_DISPLAY_USER }}

      - name: Download and extract submission files
        run: |
          url=$(jq -r '.client_payload.submission_url' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$url"
          curl -L "$url?$SAS_TOKEN" -o submission.zip
          unzip submission.zip -d submission
        env:
          SAS_TOKEN: ${{ secrets.SUBMISSION_CONTAINER_SAS_TOKEN }}

      - name: Download and extract question files
        run: |
          curl -L "$(jq -r '.client_payload.question_url' "$GITHUB_EVENT_PATH")?$SAS_TOKEN" -o question.zip
          unzip question.zip -d question
        env:
          SAS_TOKEN: ${{ secrets.QUESTION_CONTAINER_SAS_TOKEN }}

      - name: Clean unnecessary files
        uses: ./.github/actions/clean

      - name: Restore tests
        uses: ./.github/actions/restore

      - name: Restore inputs
        run: |
          if [ "${{ github.event.client_payload.strict_inputs }}" = "true" ]; then
            rm -rf submission/src
            if [ -d question/src ]; then
              cp -rf question/src ./submission
            fi
          fi

      - name: Install submission dependencies
        run: cd submission && pnpm install --ignore-scripts --fix-lockfile

      - name: Execute answer script
        run: |
          sed -i 's/\r$//' ./submission/execute.sh
          cd submission && bash execute.sh

      - name: Clean unnecessary files
        uses: ./.github/actions/clean
        with:
          preserve_output: true

      - name: Download and extract question files again
        run: |
          rm -rf question question.zip
          curl -L "$(jq -r '.client_payload.question_url' "$GITHUB_EVENT_PATH")?$SAS_TOKEN" -o question.zip
          unzip question.zip -d question
        env:
          SAS_TOKEN: ${{ secrets.QUESTION_CONTAINER_SAS_TOKEN }}

      - name: Restore tests
        uses: ./.github/actions/restore

      - name: Run tests
        run: cd submission && pnpm dlx jest@29.6.2

  report:
    name: Update Score
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    environment:
      name: grading
      deployment: false
    steps:
      - name: Update score
        run: |
          curl -fsS --retry 3 -X PATCH "$BASHAWAY_SERVER_URL/api/submissions/$SUBMISSION_ID" \
            -H "x-api-key: $BASHAWAY_SERVER_API_KEY" \
            -H 'content-type: application/json' \
            -d '{"automatically_graded":true}'
        env:
          SUBMISSION_ID: ${{ github.event.client_payload.submission_id }}
          BASHAWAY_SERVER_URL: ${{ secrets[format('BASHAWAY_{0}_SERVER_URL', inputs.application_environment)] }}
          BASHAWAY_SERVER_API_KEY: ${{ secrets[format('BASHAWAY_{0}_SERVER_API_KEY', inputs.application_environment)] }}
